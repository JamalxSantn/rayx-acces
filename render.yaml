# Render Blueprint for Rayx Acces - FREE PLAN (single service)
# Dashboard -> New + -> Blueprint -> pick the repo with this file -> Apply.
#
# One free Web Service runs everything:
#   npm run start:free  =  API + built React panel + Discord bot, same process.
# Free plan has no background workers and no disks, so the bot lives inside the
# web service and talks to the API over 127.0.0.1 (API_INTERNAL=true).
#
# Want the persistent 2-service setup instead? Use render-starter.yaml.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rayx-acces
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production

      # Bot calls the API on loopback; PORT is injected by Render.
      - key: API_INTERNAL
        value: "true"

      - key: TOTP_ISSUER
        value: Rayx Acces

      # Generated by Render, stable across deploys/restarts.
      - key: JWT_SECRET
        generateValue: true
      # Same env for API and bot, so no manual copy needed.
      - key: BOT_API_KEY
        generateValue: true

      # Hidden owner password on the login form - type your own.
      - key: SECRET_PHRASE
        sync: false
      # Discord bot token - type it once.
      - key: BOT_TOKEN
        sync: false

      # --- Discord wiring (guild "Server von jamal") ---
      - key: CLIENT_ID
        value: "1549861961196376115"
      - key: MAIN_GUILD_ID
        value: "1567899980340133991"
      - key: TICKET_GUILD_ID
        value: "1567899980340133991"
      - key: STAFF_ROLE_ID
        value: "1567902415649374308"
      - key: OPEN_TICKETS_CATEGORY_ID
        value: "1567902437325414492"
      - key: CLOSED_TICKETS_CATEGORY_ID
        value: "1567902440504696902"
      - key: TICKET_PANEL_CHANNEL_ID
        value: "1567902451669925928"
      - key: ANNOUNCEMENTS_CHANNEL_ID
        value: "1567902449057013770"
      - key: CHANGELOGS_CHANNEL_ID
        value: "1567902681572450484"
